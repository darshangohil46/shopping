<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your order summary</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111; margin: 0; padding: 24px; background-color: #fafafa; }
    .container { max-width: 580px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e5e5; padding: 24px; }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
    p { font-size: 14px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #000; font-size: 12px; text-transform: uppercase; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    .text-right { text-align: right; }
    .total-row { font-weight: bold; border-top: 2px solid #000; border-bottom: 2px solid #000; font-size: 14px; }
    .footer { font-size: 11px; color: #666; margin-top: 24px; border-top: 1px solid #eee; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Your order summary</h2>
    <p>Hi {{userName}}, thanks for your order. Here is your bill:</p>
    
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th class="text-right">Qty</th>
          <th class="text-right">Price</th>
          <th class="text-right">Total</th>
        </tr>
      </thead>
      <tbody>
        {{tableRows}}
        <tr class="total-row">
          <td colspan="3">Grand total</td>
          <td class="text-right">Rs. {{grandTotal}}</td>
        </tr>
      </tbody>
    </table>

    <p>We are processing your order and will dispatch it shortly.</p>
  </div>
</body>
</html>
